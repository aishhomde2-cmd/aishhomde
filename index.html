<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173F35">
<title>نظام الحضور والانصراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#fff; --sunk:#F4F7F5;
  --ink:#14241F; --ink-2:#3A4B45; --muted:#63746D; --line:#D7E0DB; --line-2:#E7EDEA;
  --pri:#1C5A4A; --pri-h:#154738; --pri-soft:#E1EEE8;
  --board:#173F35; --chalk:#F3F6EF; --chalk-dim:#A8C1B6;
  --ok:#1B6F45; --ok-bg:#DDF1E5;
  --warn:#875700; --warn-bg:#FAEDD2;
  --bad:#A63726; --bad-bg:#FAE4DF;
  --info:#255682; --info-bg:#E1EBF5;
  --r1:8px; --r2:12px; --r3:18px;
  --shadow:0 1px 2px rgba(20,36,31,.06),0 8px 22px -12px rgba(20,36,31,.18);
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid rgba(28,90,74,.45);outline-offset:2px}

/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:var(--r2);background:var(--pri);color:#fff;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background-color .15s,transform .05s}
.btn:hover{background:var(--pri-h)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{background:var(--bad)}
.btn.danger:hover{background:#8C2D1F}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:var(--r1)}
.btn.lg{min-height:56px;font-size:17px;border-radius:14px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:16px;height:16px}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r1);color:var(--muted);transition:background-color .15s,color .15s}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed;background:none}
.icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.icon-btn svg{width:18px;height:18px}
.link{color:var(--pri);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-size:inherit}
.spin{width:17px;height:17px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* حقول */
.f{margin-bottom:14px}
.f label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);font-size:15px;transition:border-color .15s,box-shadow .15s}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(28,90,74,.16)}
.f input:disabled,.f select:disabled{background:var(--sunk);color:var(--muted)}
input[dir=ltr]{text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 140px;gap:12px}
@media(max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.in-wrap{display:flex;gap:8px}
.in-wrap input{flex:1}
.in{min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);font-size:14px}
.alert{padding:10px 14px;border-radius:var(--r2);font-size:14px;line-height:1.7;margin-bottom:14px;white-space:pre-line;background:var(--bad-bg);color:var(--bad)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.note{font-size:13.5px;color:var(--muted);margin-bottom:14px;line-height:1.7}

/* شاشة البدء */
.boot{min-height:100vh;min-height:100dvh;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.boot .spin{width:28px;height:28px;color:var(--pri)}

/* دخول الإدارة */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--r3);padding:30px 26px 24px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-mk{width:46px;height:46px;border-radius:13px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.brand-mk svg{width:24px;height:24px}
.brand h1{font-size:18px;font-weight:700;line-height:1.35}
.brand p{font-size:13.5px;color:var(--muted)}
.auth-links{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:13.5px;min-height:22px}
.divider{border-top:1px solid var(--line-2);margin:20px 0 16px}

/* واجهة الإدارة */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:1120px;margin:auto;padding:12px 20px 2px;display:flex;align-items:center;gap:14px}
.t-school{font-weight:700;font-size:17px;line-height:1.3}
.t-year{font-size:12.5px;color:var(--muted)}
.t-user{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.nav{max-width:1120px;margin:auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:11px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-current=page]{color:var(--pri);border-bottom-color:var(--pri)}
.main{max-width:1120px;margin:auto;padding:20px 20px calc(48px + env(safe-area-inset-bottom))}
@media(max-width:600px){.main{padding:14px 12px calc(40px + env(safe-area-inset-bottom))}.topbar-in{padding:10px 14px 0}.t-user span{display:none}}

.panel{background:var(--surface);border-radius:var(--r3);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel-h h2{font-size:16px;font-weight:700}
.panel-b{padding:18px}
.spacer{flex:1}
.day-off{font-size:13px;color:var(--warn);background:var(--warn-bg);padding:2px 10px;border-radius:999px;font-weight:600}
.loading{padding:48px 16px;text-align:center;color:var(--muted);display:flex;gap:10px;justify-content:center;align-items:center}

/* شريط الأرقام */
.stats{display:grid;grid-template-columns:1.5fr repeat(3,1fr);background:var(--surface);border-radius:var(--r3);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.stat{padding:16px 18px;border-inline-start:1px solid var(--line-2)}
.stat:first-child{border-inline-start:0}
.stat-l{font-size:13px;color:var(--muted);font-weight:500}
.stat-v{font-size:30px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:2px}
.stat-v small{font-size:14px;font-weight:500;color:var(--muted)}
.stat-v.warn{color:var(--warn)}
.stat-v.bad{color:var(--bad)}
.meter{height:6px;border-radius:6px;background:var(--line-2);margin-top:10px;overflow:hidden;position:relative}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--pri);border-radius:6px}
@media(max-width:720px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat.lead{grid-column:1/-1;border-bottom:1px solid var(--line-2)}
  .stat:nth-child(2){border-inline-start:0}
  .stat{padding:12px 14px}
  .stat-v{font-size:24px}
}

/* جداول */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 16px;background:var(--sunk);border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFCFB}
td.num,th.num{font-variant-numeric:tabular-nums}
.who b{display:block;font-weight:600}
.who span{display:block;font-size:12.5px;color:var(--muted)}
.t-in{color:var(--ok);font-weight:600}
.t-out{color:var(--bad);font-weight:600}
.dim{color:var(--muted)}
.acts{text-align:end}
td.empty{padding:44px 16px;text-align:center;color:var(--muted);white-space:normal}
td.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.pct{display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.pct .meter{width:90px;margin:0}
.pct.ok{color:var(--ok)}.pct.ok .meter i{background:var(--ok)}
.pct.warn{color:var(--warn)}.pct.warn .meter i{background:#D39A20}
.pct.bad{color:var(--bad)}.pct.bad .meter i{background:var(--bad)}

/* وسوم الحالة */
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.8;margin-inline-end:4px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.muted{background:var(--sunk);color:var(--muted)}

/* الغائبون */
.absent{padding:12px 16px;border-top:1px solid var(--line-2)}
.absent summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--bad);width:max-content;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:4px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.chip:hover{background:var(--pri-soft)}

/* الإعدادات */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.grid2 .panel{margin-bottom:0}
.span2{grid-column:1/-1}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day{min-height:38px;padding:0 14px;border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:13.5px;color:var(--muted);background:var(--surface)}
.day[aria-pressed=true]{background:var(--pri);color:#fff;box-shadow:none}
.loc-box{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--sunk);border-radius:var(--r2);padding:12px 14px;margin-bottom:16px}
.loc-state{font-weight:600;font-size:14px}
.loc-state.ok{color:var(--ok)}.loc-state.bad{color:var(--bad)}
.savebar{position:sticky;bottom:0;display:flex;justify-content:flex-end;padding:14px 0 calc(6px + env(safe-area-inset-bottom));margin-top:16px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.savebar .btn{min-width:180px}
@media(max-width:560px){.savebar .btn{width:100%}}

/* نافذة منبثقة */
.ov{position:fixed;inset:0;z-index:100;background:rgba(14,28,24,.5);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .15s}
.ov.open{opacity:1}
.modal{background:var(--surface);border-radius:var(--r3);width:100%;max-width:500px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);transform:translateY(10px);transition:transform .18s}
.ov.open .modal{transform:none}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.mh h2{font-size:17px;font-weight:700}
.mb{padding:18px;overflow:auto;flex:1}
.mf{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2)}
.mf .btn{flex:1}
.cred{background:var(--pri-soft);border-radius:var(--r2);padding:12px 14px;font-size:14px;line-height:1.9;display:flex;align-items:center;gap:10px}
.cred div{flex:1}
.cred b{font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media(max-width:560px){.ov{place-items:end center;padding:0}.modal{border-radius:var(--r3) var(--r3) 0 0;max-height:92dvh}}

/* تنبيه عائم */
.toast{position:fixed;z-index:200;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r2);font-weight:500;font-size:14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.4);transform:translateY(calc(100% + 40px));opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;white-space:pre-line;text-align:center}
.toast.show{transform:none;opacity:1}
.toast.err{background:var(--bad)}

/* شاشة الموظف: السبّورة */
.att{min-height:100vh;min-height:100dvh;background:var(--board);padding:calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.att-wrap{max-width:460px;margin:auto}
.board{color:var(--chalk);padding:4px 4px 24px}
.board-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.school{font-weight:700;font-size:16px;line-height:1.4}
.who-l{font-size:14px;color:var(--chalk-dim)}
.btn.chalk{background:rgba(255,255,255,.1);color:var(--chalk)}
.btn.chalk:hover{background:rgba(255,255,255,.18)}
.board-head{text-align:center;padding:36px 0 26px}
.board-head .school{font-size:21px}
.board-head p{color:var(--chalk-dim);font-size:14px}
.clock{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:28px;font-variant-numeric:tabular-nums;direction:ltr}
.clock b{font-size:clamp(66px,22vw,100px);font-weight:600;letter-spacing:-.02em;line-height:1}
.clock span{font-size:24px;color:var(--chalk-dim);font-weight:500;width:2.2ch;text-align:left}
.date-l{text-align:center;margin-top:10px;font-size:15px}
.date-l span{display:block;font-size:13px;color:var(--chalk-dim)}
.tl{margin-top:24px}
.tl-track{position:relative;height:8px;border-radius:8px;background:rgba(255,255,255,.13)}
.tl-fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:8px;background:rgba(243,246,239,.32)}
.tl-mk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(50%,-50%);border:2px solid var(--board)}
.tl-mk.in{background:#83D6A9}
.tl-mk.out{background:#F2A493}
.tl-now{position:absolute;top:50%;width:3px;height:22px;border-radius:2px;background:var(--chalk);transform:translate(50%,-50%)}
.tl-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--chalk-dim);margin-top:8px;font-variant-numeric:tabular-nums}
.sheet{background:var(--surface);border-radius:var(--r3);padding:18px;margin-bottom:12px;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.status{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:14px}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.status.s-none{color:var(--warn)}
.status.s-in{color:var(--ok)}
.status.s-done{color:var(--muted)}
.status small{font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:auto}
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.recap div{background:var(--sunk);border-radius:var(--r2);padding:9px 12px}
.recap span{display:block;font-size:12.5px;color:var(--muted)}
.recap b{font-size:18px;font-variant-numeric:tabular-nums}
.btn.punch-out{background:var(--bad)}
.btn.punch-out:hover{background:#8C2D1F}
.done-l{text-align:center;color:var(--muted);font-weight:500;padding:6px 0}
.gps{text-align:center;font-size:12.5px;margin-top:12px;color:var(--muted)}
.gps.off{color:var(--bad)}
.hist h2{font-size:15px;font-weight:700;margin-bottom:6px}
.hist ul{list-style:none}
.hist li{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px}
.hist li:first-child{border-top:0}
.hist .d b{display:block;font-weight:600}
.hist .d span,.hist .tm span{display:block;font-size:12px;color:var(--muted)}
.hist .tm{font-variant-numeric:tabular-nums;text-align:center}
.hist .tag{margin:0}
.hist .empty{padding:24px 0;text-align:center;color:var(--muted);display:block}
.sheet .link{display:block;margin:14px auto 0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:1.5s!important}}
</style>
</head>
<body>

<div id="bootScreen" class="boot"><div><span class="spin" aria-hidden="true"></span><p id="bootMsg" style="margin-top:12px">جاري التحميل…</p></div></div>

<!-- دخول الإدارة -->
<main id="authScreen" class="auth" hidden>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg></div>
      <div><h1 id="authSchool">نظام الحضور والانصراف</h1><p id="authSub">دخول الإدارة</p></div>
    </div>
    <form id="authForm" data-submit="auth" novalidate>
      <div class="alert" id="authErr" role="alert" hidden></div>
      <div class="f" id="wName" hidden><label for="fName">الاسم الكامل</label><input id="fName" autocomplete="name"></div>
      <div class="f"><label for="fEmail">البريد الإلكتروني</label><input type="email" id="fEmail" dir="ltr" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></div>
      <div class="f"><label for="fPass">كلمة المرور</label><input type="password" id="fPass" dir="ltr" autocomplete="current-password"></div>
      <div class="f" id="wPass2" hidden><label for="fPass2">تأكيد كلمة المرور</label><input type="password" id="fPass2" dir="ltr" autocomplete="new-password"></div>
      <button class="btn block lg" id="authBtn" type="submit">دخول</button>
    </form>
    <div class="auth-links"><button type="button" class="link" id="forgotLink" data-act="forgot">نسيت كلمة المرور؟</button><span id="modeLink"></span></div>
    <div class="divider"></div>
    <button type="button" class="btn ghost block" data-act="toEmp">دخول الموظفين لتسجيل الحضور</button>
  </div>
</main>

<!-- شاشة الموظف -->
<div id="attScreen" class="att" hidden><div class="att-wrap" id="attWrap"></div></div>

<!-- لوحة الإدارة -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <div><div class="t-school" id="appTitle"></div><div class="t-year" id="appYear"></div></div>
      <div class="t-user"><span id="userName"></span><button type="button" class="btn ghost sm" data-act="logout">خروج</button></div>
    </div>
    <nav class="nav" id="tabs" aria-label="أقسام النظام"></nav>
  </header>

/* ====== كلمات مرور الموظفين ====== */
function djb2(s) { let h = 5381; for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h = h & 0xffffffff; } return h >>> 0; }
const legacyHash = s => String(djb2(s));
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function sha256(str) {
  if (!(window.crypto && crypto.subtle)) throw userErr('المتصفح لا يدعم التشفير الآمن. افتح النظام عبر رابط https');
  return toHex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)));
}
async function makePw(pass) {
  const salt = toHex(crypto.getRandomValues(new Uint8Array(12)));
  return { pwSalt: salt, pwHash: await sha256(salt + ':' + pass), pwVer: 2 };
}
async function checkPw(emp, pass) {
  if (emp.pwVer === 2 && emp.pwSalt) return (await sha256(emp.pwSalt + ':' + pass)) === emp.pwHash;
  return !!emp.pwHash && emp.pwHash === legacyHash(pass);
}
function genPassword() {
  const A = 'abcdefghjkmnpqrstuvwxyz23456789';
  return [...crypto.getRandomValues(new Uint32Array(6))].map(x => A[x % A.length]).join('');
}
const TR = { 'ا': 'a', 'أ': 'a', 'إ': 'e', 'آ': 'a', 'ب': 'b', 'ت': 't', 'ث': 'th', 'ج': 'j', 'ح': 'h', 'خ': 'kh', 'د': 'd', 'ذ': 'th', 'ر': 'r', 'ز': 'z', 'س': 's', 'ش': 'sh', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': 'a', 'غ': 'gh', 'ف': 'f', 'ق': 'q', 'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ه': 'h', 'ة': 'a', 'و': 'w', 'ي': 'y', 'ى': 'a', 'ئ': 'e', 'ؤ': 'o', 'ء': '' };
function genUsername(name) {
  const first = (name || '').trim().split(/\s+/)[0] || '';
  let base = [...first].map(ch => TR[ch] ?? (/[a-z0-9]/i.test(ch) ? ch.toLowerCase() : '')).join('').slice(0, 10);

}

async function doAuth() {
  const err = $('#authErr'); err.hidden = true;
  const email = ($('#fEmail').value || '').trim().toLowerCase();
  const pass = $('#fPass').value || '';
  const btn = $('#authBtn');
  try {
    if (AUTH_MODE === 'signup') {
      const nm = ($('#fName').value || '').trim();
      if (!nm) throw userErr('أدخل اسمك الكامل');
      if (!email) throw userErr('أدخل البريد الإلكتروني');
      if (pass.length < 6) throw userErr('كلمة المرور ٦ أحرف على الأقل');
      if (pass !== $('#fPass2').value) throw userErr('كلمتا المرور غير متطابقتين');
      busy(btn, 'جاري إنشاء الحساب…');
      PENDING_SIGNUP = true;
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await db.collection('users').doc(cred.user.uid).set({ name: nm, email, role: 'owner', createdAt: new Date().toISOString() });
      const c = await db.collection('meta').doc('config').get();
      if (!c.exists) await db.collection('meta').doc('config').set(clone(DEFAULT_CFG));
      await loadCfg();
      PENDING_SIGNUP = false;
      CUR.tab = 'settings';
      await enterAdmin(cred.user, nm);
      toast('تم إنشاء الحساب. ابدأ بضبط الإعدادات وموقع المدرسة');
    } else {
      if (!email || !pass) throw userErr('أدخل البريد الإلكتروني وكلمة المرور');

  }
}

  } catch (e) {}

      ST.attUsers = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));

// إزالة كلمات المرور المخزّنة كنص مكشوف من الإصدار السابق وتحويلها إلى تشفير SHA-256
let _migrated = false;
async function migratePlain() {
  if (_migrated) return;
  _migrated = true;
  const list = ST.attUsers.filter(u => u.pwPlain && u.pwVer !== 2 && legacyHash(u.pwPlain) === u.pwHash);
  const stale = ST.attUsers.filter(u => u.pwPlain && !list.includes(u));
  let n = 0;
  for (const u of list) {
    try { await db.collection('attUsers').doc(u.id).update(Object.assign(await makePw(u.pwPlain), { pwPlain: FV.delete() })); n++; }
    catch (e) { console.warn('migrate', e); }
  }
  for (const u of stale) { try { await db.collection('attUsers').doc(u.id).update({ pwPlain: FV.delete() }); } catch (e) {} }
  if (n) toast(`تم تأمين كلمات مرور ${n} موظف`);
}

/* ==================== تحميل السجلات حسب الشهر (مباشر) ==================== */
function watchMonth(ym) {
  if (watchedMonth === ym) return;
  if (unsubMonth) unsubMonth();
  watchedMonth = ym;
  if (!ST.months[ym]) ST.months[ym] = { loaded: false, recs: [] };
  const days = monthDays(ym);
  unsubMonth = db.collection('attendance').where('date', '>=', days[0]).where('date', '<=', days[days.length - 1])
    .onSnapshot(snap => {
      ST.months[ym] = { loaded: true, recs: snap.docs.map(d => ({ id: d.id, ...d.data() })) };
      if (watchedMonth === ym && ['records', 'stats', 'monthly'].includes(CUR.tab)) softRender();
    }, e => {
      ST.months[ym] = { loaded: true, recs: [], error: errMsg(e) };
      if (watchedMonth === ym) { unsubMonth = null; softRender(); }
    });
}
const recsOf = ym => (ST.months[ym] && ST.months[ym].recs) || [];
const activeUsers = () => ST.attUsers.filter(u => u.active !== false);
function findRec(id) { for (const k in ST.months) { const r = ST.months[k].recs.find(x => x.id === id); if (r) return r; } return null; }
function loadingOr(ym) {
  const M = ST.months[ym];
  if (M && M.error) return `<div class="loading" style="color:var(--bad)">${esc(M.error)} <button type="button" class="btn ghost sm" data-act="retryMonth">إعادة المحاولة</button></div>`;
  if (!M || !M.loaded || !ST.usersLoaded) return '<div class="loading"><span class="spin"></span> جاري تحميل السجلات…</div>';
  return '';
}
const tag = (c, t) => `<span class="tag ${c}">${esc(t)}</span>`;

function vRecords() {
  const t = today();
  const d = CUR.recDate || t;

  watchMonth(ym);
  const wait = loadingOr(ym);
  const workday = isWorkDay(d);

  const toolbar = `
    <div class="panel-h">
      <button type="button" class="icon-btn" data-act="dayShift" data-id="-1" aria-label="اليوم السابق">${IC.prev}</button>

      ${d !== t ? '<button type="button" class="btn ghost sm" data-act="recToday">اليوم</button>' : ''}
      <strong style="font-size:15px">${AR_DAYS[dayOfWeek(d)]}</strong>
      ${!workday ? '<span class="day-off">ليس يوم دوام</span>' : ''}

      <button type="button" class="btn sm" data-act="manual">${IC.plus} تسجيل يدوي</button>
    </div>`;

  if (wait) return `<section class="panel">${toolbar}${wait}</section>`;

  const users = activeUsers();
  const recs = recsOf(ym).filter(r => r.date === d).sort((a, b) => (a.inTime || '').localeCompare(b.inTime || ''));
  const presentIds = new Set(recs.map(r => r.userId));
  const presentActive = users.filter(u => presentIds.has(u.id)).length;
  const late = recs.filter(r => recLate(r) > 0).length;
  const early = recs.filter(r => recEarly(r) > 0).length;
  const absentUsers = workday && d <= t ? users.filter(u => !presentIds.has(u.id) && (!u.joinDate || u.joinDate <= d)) : [];
  const rate = users.length ? Math.round(presentActive / users.length * 100) : 0;
  const uMap = new Map(ST.attUsers.map(u => [u.id, u]));
  const beforeEnd = d === t && hm2min(nowHM()) < hm2min(attCfg().outTime);

  const rows = recs.length ? recs.map(r => {
    const u = uMap.get(r.userId);
    const lm = recLate(r), em = recEarly(r);
    const tags = [];
    if (!r.outTime) tags.push(beforeEnd ? tag('info', 'في الدوام') : tag('muted', 'بدون انصراف'));
    if (lm) tags.push(tag('warn', `تأخر ${lm}د`));
    if (em) tags.push(tag('warn', `مبكر ${em}د`));
    if (r.outTime && !lm && !em) tags.push(tag('ok', 'منضبط'));
    if (r.addedByAdmin) tags.push(tag('muted', 'يدوي'));
    return `<tr>
      <td><div class="who"><b>${esc(r.userName || (u && u.name) || '—')}</b><span>${esc((u && u.job) || '')}</span></div></td>
      <td class="num t-in">${esc(r.inTime || '—')}</td>

      <td class="num">${r.outTime ? fmtDur(workMinOf(r.inTime, r.outTime)) : '—'}</td>
      <td>${tags.join('')}</td>
      <td class="acts"><button type="button" class="icon-btn" data-act="editRec" data-id="${esc(r.id)}" aria-label="تعديل السجل">${IC.edit}</button><button type="button" class="icon-btn danger" data-act="delRec" data-id="${esc(r.id)}" aria-label="حذف السجل">${IC.trash}</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" class="empty"><b>لا توجد سجلات في هذا اليوم</b>${users.length ? 'ستظهر هنا فور تسجيل الموظفين حضورهم' : 'ابدأ بإضافة الموظفين من تبويب «الموظفون»'}</td></tr>`;

      <div class="stat"><div class="stat-l">انصراف مبكر</div><div class="stat-v ${early ? 'warn' : ''}">${early}</div></div>
      <div class="stat"><div class="stat-l">الغائبون</div><div class="stat-v ${absentUsers.length ? 'bad' : ''}">${workday && d <= t ? absentUsers.length : '—'}</div></div>
    </div>
    <section class="panel">
      ${toolbar}
      <div class="tw"><table>
        <thead><tr><th>الموظف</th><th>الحضور</th><th>الانصراف</th><th>المدة</th><th>الحالة</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${absentUsers.length ? `<details class="absent"><summary>لم يسجّلوا حضوراً (${absentUsers.length})</summary>
        <div class="chips">${absentUsers.map(u => `<button type="button" class="chip" data-act="manual" data-id="${esc(u.id)}" title="تسجيل حضور يدوي">${esc(u.name)}</button>`).join('')}</div>

async function saveRec(recId) {
  const btn = $('#mForm [type=submit]');
  const inTime = $('#mIn').value, outTime = $('#mOut').value, note = $('#mNote').value.trim();
  if (!inTime) return toast('أدخل وقت الحضور', true);
  if (outTime && hm2min(outTime) <= hm2min(inTime)) return toast('وقت الانصراف يجب أن يكون بعد وقت الحضور', true);
  const calc = { inTime, outTime: outTime || '', lateMin: lateMinOf(inTime), earlyMin: earlyMinOf(outTime), workMin: workMinOf(inTime, outTime), adminNote: note };
  busy(btn, 'جاري الحفظ…');
  try {
    if (recId) {
      await db.collection('attendance').doc(recId).update(Object.assign(calc, { editedByAdmin: true, editedAt: new Date().toISOString() }));
      toast('تم حفظ التعديل');
    } else {
      const userId = $('#mUser').value, date = $('#mDate').value;
      if (!userId || !date) { unbusy(btn); return toast('اختر الموظف والتاريخ', true); }
      const ex = await db.collection('attendance').where('userId', '==', userId).where('date', '==', date).limit(1).get();
      if (!ex.empty) { unbusy(btn); return toast('يوجد سجل لهذا الموظف في هذا اليوم. عدّله بدلاً من إضافة سجل جديد', true); }
      const u = ST.attUsers.find(x => x.id === userId);
      await db.collection('attendance').doc(userId + '_' + date).set(Object.assign(calc, { userId, userName: (u && u.name) || '', date, addedByAdmin: true, ts: Date.now() }));
      toast('تم التسجيل');
    }
    closeM();
  } catch (e) { unbusy(btn); toast(errMsg(e), true); }
}

async function delRec(id) {
  const r = findRec(id);
  if (!await confirmM('حذف السجل', `سيُحذف سجل ${r ? r.userName || '' : ''} بتاريخ ${fmtDate(r && r.date)} نهائياً.`, 'حذف السجل')) return;
  try { await db.collection('attendance').doc(id).delete(); toast('تم حذف السجل'); }
  catch (e) { toast(errMsg(e), true); }
}

/* ==================== ملخص الشهر ==================== */
function monthSummary(ym) {
  const t = today(), days = monthDays(ym), by = new Map();
  for (const r of recsOf(ym)) { if (!by.has(r.userId)) by.set(r.userId, []); by.get(r.userId).push(r); }
  return activeUsers().map(u => {
    const rs = by.get(u.id) || [];
    const dates = new Set(rs.map(r => r.date));
    const join = u.joinDate || (rs.length ? rs.reduce((m, r) => r.date < m ? r.date : m, rs[0].date) : null);
    const past = join ? days.filter(d => d < t && d >= join && isWorkDay(d)) : [];
    const absent = past.filter(d => !dates.has(d)).length;
    const base = past.length + (dates.has(t) ? 1 : 0);
    const attended = past.length - absent + (dates.has(t) ? 1 : 0);
    const lateRs = rs.filter(r => recLate(r) > 0), earlyRs = rs.filter(r => recEarly(r) > 0), done = rs.filter(r => r.outTime);
    const totalWork = done.reduce((a, r) => a + workMinOf(r.inTime, r.outTime), 0);
    return {
      u, present: dates.size, absent, pct: base ? Math.round(attended / base * 100) : null,
      lateDays: lateRs.length, totalLate: lateRs.reduce((a, r) => a + recLate(r), 0),
      earlyDays: earlyRs.length, totalEarly: earlyRs.reduce((a, r) => a + recEarly(r), 0),
      totalWork, avgWork: done.length ? Math.round(totalWork / done.length) : 0
    };
  });
}

    <input type="month" class="in" value="${ym}" max="${cur}" data-change="month" aria-label="الشهر">

let _xlsxP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return _xlsxP || (_xlsxP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { _xlsxP = null; rej(userErr('تعذّر تحميل مكتبة Excel. تحقّق من الاتصال')); };
    document.head.appendChild(s);
  }));
}

let _mActions = [], _mPrevFocus = null, _mOnClose = null;
function openM(title, body, actions, onClose) {
  _mPrevFocus = document.activeElement;
  _mActions = actions;
  _mOnClose = onClose || null;
  $('#modal').innerHTML = `
    <div class="mh"><h2 id="mTitle">${esc(title)}</h2><button type="button" class="icon-btn" data-act="closeM" aria-label="إغلاق">${IC.x}</button></div>

      <div class="mf">${actions.map((a, i) => `<button type="${a.primary ? 'submit' : 'button'}" class="btn ${a.cls || ''}" ${a.primary ? '' : `data-act="mAct" data-id="${i}"`}>${esc(a.label)}</button>`).join('')}</div>
    </form>`;
  const ov = $('#ov');
  ov.hidden = false;
  requestAnimationFrame(() => ov.classList.add('open'));
  const first = $('#modal .mb').querySelector('input:not([disabled]),select:not([disabled]),textarea');
  setTimeout(() => (first || $('#modal .mf .btn:last-child')).focus(), 30);
}
function closeM() {
  const ov = $('#ov');
  if (ov.hidden) return;
  ov.classList.remove('open');
  ov.hidden = true;
  $('#modal').innerHTML = '';
  const cb = _mOnClose; _mOnClose = null;
  if (cb) cb();
  if (_mPrevFocus && document.contains(_mPrevFocus)) _mPrevFocus.focus();
}
function confirmM(title, text, okLabel, okCls) {
  return new Promise(res => {
    let done = false;
    const finish = v => { if (done) return; done = true; res(v); };
    openM(title, `<p style="line-height:1.8;white-space:pre-line">${esc(text)}</p>`, [
      { label: 'إلغاء', cls: 'ghost', fn: () => { finish(false); closeM(); } },
      { label: okLabel || 'تأكيد', cls: okCls || 'danger', primary: true, fn: () => { finish(true); closeM(); } }
    ], () => finish(false));
  });
}

/* ==================== الموقع الجغرافي ==================== */
function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLng = toR(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function getPos(timeout) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(userErr('جهازك لا يدعم تحديد الموقع'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => {
        const m = e.code === 1 ? 'يجب السماح للمتصفح بالوصول إلى موقعك من إعدادات الجهاز' : e.code === 3 ? 'انتهت مهلة تحديد الموقع. انتقل لمكان مكشوف وأعد المحاولة' : 'تعذّر تحديد الموقع. تأكد من تشغيل خدمة الموقع (GPS)';
        rej(Object.assign(userErr(m), { geoCode: e.code }));
      },
      { enableHighAccuracy: true, timeout: timeout || 15000, maximumAge: 0 }
    );
  });
}
async function getBestPos(tries = 3) {
  let best = null, lastErr = null;
  for (let i = 0; i < tries; i++) {
    try {
      const p = await getPos(i ? 8000 : 15000);
      if (!best || p.acc < best.acc) best = p;
      if (p.acc <= 20) break;
    } catch (e) { lastErr = e; if (e.geoCode === 1) break; }
    if (i < tries - 1) await sleep(600);
  }
  if (!best) throw lastErr || userErr('تعذّر تحديد الموقع');
  return best;
}
async function verifyLocation() {
  const c = attCfg();
  if (c.lat == null || c.lng == null) return { ok: false, reason: 'لم تحدّد الإدارة موقع المدرسة بعد. تواصل معها.' };
  const pos = await getBestPos(3);
  const dist = Math.round(distanceM(pos.lat, pos.lng, Number(c.lat), Number(c.lng)));
  const acc = Math.round(pos.acc || 0);
  const radius = num(c.radius) || 150;
  if (dist > radius + Math.min(acc, 30)) return { ok: false, dist, radius, acc };
  return { ok: true, dist, acc };
}

      <button type="button" class="link" data-act="toAdmin">دخول الإدارة</button>
    </form>`;
  setTimeout(() => { const i = $('#attU'); if (i) i.focus(); }, 60);
}

async function attLoginSubmit() {
  const u = ($('#attU').value || '').trim().toLowerCase();
  const p = $('#attP').value || '';
  const err = $('#attErr'); err.hidden = true;
  if (!u || !p) return showAlert(err, 'أدخل اسم المستخدم وكلمة المرور');
  const btn = $('#attBtn');
  busy(btn, 'جاري التحقق…');
  try {
    if (!ST.cfg) await loadCfg();
    // استعلام عن موظف واحد فقط بدلاً من تنزيل جميع الحسابات
    const snap = await db.collection('attUsers').where('username', '==', u).limit(5).get();
    let emp = null;
    for (const d of snap.docs) { const x = { id: d.id, ...d.data() }; if (await checkPw(x, p)) { emp = x; break; } }
    if (!emp) throw userErr('اسم المستخدم أو كلمة المرور غير صحيحة');
    if (emp.active === false) throw userErr('هذا الحساب موقوف. راجع الإدارة');
    const dev = deviceId();
    if (emp.deviceId && emp.deviceId !== dev) throw userErr('هذا الحساب مرتبط بجهاز آخر.\nاطلب من الإدارة فك الارتباط ثم أعد المحاولة.');
    if (!emp.deviceId) {
      const bind = { deviceId: dev, deviceBoundAt: new Date().toISOString() };
      await withTimeout(db.collection('attUsers').doc(emp.id).update(bind), 12000);
      Object.assign(emp, bind);
    }
    if (emp.pwVer !== 2) { // ترقية تشفير كلمة المرور القديمة
      try { const up = await makePw(p); await db.collection('attUsers').doc(emp.id).update(Object.assign({}, up, { pwPlain: FV.delete() })); Object.assign(emp, up); delete emp.pwPlain; }
      catch (e) { console.warn('pw upgrade', e); }
    }
    ATT.user = emp;
    saveSess(emp);
    await enterAtt();
  } catch (e) {
    unbusy(btn);
    showAlert(err, e.user ? e.message : errMsg(e));
  }
}

// مزامنة الساعة مع خادم Firebase: يمنع تسجيل وقت مزيّف بتغيير ساعة الجوال
async function syncClock(empId) {
  const ref = db.collection('attUsers').doc(empId);
  const t0 = Date.now();
  await withTimeout(ref.update({ lastSeen: FV.serverTimestamp() }), 8000);
  const t1 = Date.now();
  const snap = await withTimeout(ref.get({ source: 'server' }), 8000);
  const ts = snap.get('lastSeen');
  if (ts && ts.toMillis) CLOCK_OFFSET = ts.toMillis() - Math.round((t0 + t1) / 2);
}

async function enterAtt() {
  const [, snap] = await Promise.all([
    syncClock(ATT.user.id).catch(e => console.warn('clock sync', e)),
    db.collection('attendance').where('userId', '==', ATT.user.id).get()
  ]);
  ATT.recs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  showScreen('attScreen');
  renderAttScreen();
}

async function restoreAtt(sess) {
  try {
    const d = await db.collection('attUsers').doc(sess.id).get();
    if (!d.exists) throw 0;
    const emp = { id: d.id, ...d.data() };
    if (emp.active === false || !emp.deviceId || emp.deviceId !== deviceId() || String(emp.pwHash || '').slice(0, 12) !== sess.k) throw 0;
    ATT.user = emp;
    await enterAtt();
    return true;
  } catch (e) {
    if (e === 0) clearSess();
    return false;
  }
}

function attLogout() {
  ATT.user = null; ATT.recs = [];
  clearSess();
  showAttLogin();
}

const myToday = () => ATT.recs.find(r => r.date === today());

let _ticker = null, _tickDate = null;
function stopTicker() { if (_ticker) clearInterval(_ticker); _ticker = null; }
function startTicker() {
  stopTicker();
  _tickDate = today();
  _ticker = setInterval(() => {
    const p = zoneParts(nowDate());
    if (p.date !== _tickDate) return renderAttScreen(); // يوم جديد
    const c = $('#attClock'), s = $('#attSec'), n = $('#tlNow'), f = $('#tlFill');
    if (!c) return stopTicker();
    c.textContent = p.hm; s.textContent = p.sec;
    const pos = tlPos(hm2min(p.hm));
    if (n && pos != null) n.style.insetInlineStart = pos + '%';
    if (f && pos != null) f.style.width = pos + '%';
  }, 1000);
}
function tlPos(m) {
  const c = attCfg(), s = hm2min(c.inTime), e = hm2min(c.outTime);
  if (e <= s) return null;
  return Math.min(100, Math.max(0, (m - s) / (e - s) * 100));
}

function renderAttScreen() {
  const u = ATT.user, c = attCfg(), t = today(), rec = myToday();
  const p = zoneParts(nowDate());
  const state = !rec ? 'none' : !rec.outTime ? 'in' : 'done';
  const statusTxt = { none: 'لم تسجّل حضورك اليوم', in: 'أنت في الدوام الآن', done: 'انتهى دوامك اليوم' }[state];
  const gpsReady = c.lat != null && c.lng != null;
  const nowPos = tlPos(hm2min(p.hm));
  const tl = nowPos == null ? '' : `
    <div class="tl" aria-hidden="true">
      <div class="tl-track">
        <i class="tl-fill" id="tlFill" style="width:${nowPos}%"></i>
        ${rec && rec.inTime ? `<b class="tl-mk in" style="inset-inline-start:${tlPos(hm2min(rec.inTime))}%"></b>` : ''}
        ${rec && rec.outTime ? `<b class="tl-mk out" style="inset-inline-start:${tlPos(hm2min(rec.outTime))}%"></b>` : ''}
        <b class="tl-now" id="tlNow" style="inset-inline-start:${nowPos}%"></b>
      </div>
      <div class="tl-ends"><span>${esc(c.inTime)} بداية الدوام</span><span>نهاية الدوام ${esc(c.outTime)}</span></div>
    </div>`;

  const lm = rec ? recLate(rec) : 0;
  const recap = rec ? `<div class="recap">
      <div><span>الحضور</span><b style="color:var(--ok)">${esc(rec.inTime || '—')}</b></div>
      <div><span>الانصراف</span><b style="color:${rec.outTime ? 'var(--bad)' : 'var(--muted)'}">${esc(rec.outTime || '—')}</b></div>
      <div><span>التأخر</span><b style="color:${lm ? 'var(--warn)' : 'var(--ok)'}">${lm ? lm + ' د' : 'لا يوجد'}</b></div>
    </div>` : '';

  const action = state === 'none' ? `<button type="button" class="btn block lg" id="punchBtn" data-act="punch" data-id="in">تسجيل الحضور</button>`
    : state === 'in' ? `<button type="button" class="btn block lg punch-out" id="punchBtn" data-act="punch" data-id="out">تسجيل الانصراف</button>`
    : `<div class="done-l">تم تسجيل حضورك وانصرافك. يوماً طيباً</div>`;

  const hist = ATT.recs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 14);
  const histHTML = hist.length ? `<ul>${hist.map(r => {
    const l = recLate(r);
    return `<li>
      <div class="d"><b>${AR_DAYS[dayOfWeek(r.date)]}</b><span>${fmtDate(r.date)}</span></div>
      <div class="tm"><span>حضور</span>${esc(r.inTime || '—')}</div>
      <div class="tm"><span>انصراف</span>${esc(r.outTime || '—')}</div>
      ${l ? tag('warn', l + 'د') : tag('ok', 'منضبط')}
    </li>`;
  }).join('')}</ul>` : '<span class="empty">لا توجد سجلات بعد</span>';

  const hijri = localeDate(nowDate(), 'ar-SA-u-ca-islamic-umalqura', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const greg = localeDate(nowDate(), 'ar-u-ca-gregory-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });

  $('#attWrap').innerHTML = `
    <div class="board">
      <div class="board-top">
        <div><div class="school">${esc(ST.cfg.name)}</div><div class="who-l">${esc(u.name)}، ${esc(u.job || 'موظف')}</div></div>
        <button type="button" class="btn chalk sm" data-act="attLogout">خروج</button>
      </div>
      <div class="clock"><b id="attClock">${p.hm}</b><span id="attSec">${p.sec}</span></div>
      <div class="date-l">${esc(hijri)}<span>${esc(greg)}</span></div>
      ${tl}
    </div>
    <div class="sheet">
      <div class="status s-${state}">${statusTxt}${!isWorkDay(t) ? '<small>ليس يوم دوام</small>' : ''}</div>
      ${recap}
      <div class="alert" id="attMsg" hidden></div>
      ${action}
      <div class="gps ${gpsReady ? '' : 'off'}">${gpsReady ? `يُقبل التسجيل داخل ${num(c.radius) || 150} م من المدرسة` : 'لم تحدّد الإدارة موقع المدرسة بعد'}</div>
    </div>
    <div class="sheet hist"><h2>سجلّي (آخر ١٤ يوماً)</h2>${histHTML}</div>`;
  startTicker();
}

async function attPunch(kind) {
  const btn = $('#punchBtn');
  const label = kind === 'in' ? 'تسجيل الحضور' : 'تسجيل الانصراف';
  const msg = (m, ok) => showAlert($('#attMsg'), m, ok);
  busy(btn, 'جاري تحديد موقعك…');
  try {
    try { await syncClock(ATT.user.id); }
    catch (e) {
      if (e.code === 'timeout' || e.code === 'unavailable') throw userErr('لا يوجد اتصال بالإنترنت. تحقّق من الاتصال ثم أعد المحاولة');
      console.warn('clock sync', e);
    }
    const loc = await verifyLocation();
    if (!loc.ok) {
      unbusy(btn);
      return msg(loc.reason || `أنت خارج نطاق المدرسة.\nتبعد ${loc.dist} م، والنطاق المسموح ${loc.radius} م (دقة موقعك ±${loc.acc} م).\nاقترب من المدرسة أو انتقل لمكان مكشوف ثم أعد المحاولة.`);
    }
    busy(btn, 'جاري الحفظ…');
    const date = today(), hm = nowHM();
    let rec = myToday();
    if (kind === 'in') {
      if (rec) { renderAttScreen(); return msg('سجّلت حضورك مسبقاً اليوم'); }
      const ref = db.collection('attendance').doc(ATT.user.id + '_' + date);
      const ex = await ref.get({ source: 'server' });
      if (ex.exists) { ATT.recs.push({ id: ex.id, ...ex.data() }); renderAttScreen(); return msg('سجّلت حضورك مسبقاً اليوم'); }
      const data = { userId: ATT.user.id, userName: ATT.user.name, date, inTime: hm, outTime: '', lateMin: lateMinOf(hm), ts: Date.now(), inAt: FV.serverTimestamp(), inDist: loc.dist, inAcc: loc.acc };
      await withTimeout(ref.set(data), 15000, 'تعذّر الحفظ بسبب ضعف الاتصال. أعد المحاولة');
      ATT.recs.push(Object.assign({ id: ref.id }, data, { inAt: null }));
      renderAttScreen();
      msg(lateMinOf(hm) ? `تم تسجيل حضورك الساعة ${hm} (تأخر ${lateMinOf(hm)} دقيقة)` : `تم تسجيل حضورك الساعة ${hm}`, true);
    } else {
      if (!rec) { renderAttScreen(); return msg('سجّل حضورك أولاً'); }
      if (rec.outTime) { renderAttScreen(); return msg('سجّلت انصرافك مسبقاً اليوم'); }
      if (hm2min(hm) < hm2min(attCfg().outTime)) {
        unbusy(btn);
        if (!await confirmM('انصراف قبل نهاية الدوام', `نهاية الدوام الساعة ${attCfg().outTime}، والوقت الآن ${hm}. سيُسجَّل انصرافاً مبكراً.`, 'تسجيل الانصراف')) return;
        busy(btn, 'جاري الحفظ…');
      }
      const upd = { outTime: hm, earlyMin: earlyMinOf(hm), workMin: workMinOf(rec.inTime, hm), outAt: FV.serverTimestamp(), outDist: loc.dist };
      await withTimeout(db.collection('attendance').doc(rec.id).update(upd), 15000, 'تعذّر الحفظ بسبب ضعف الاتصال. أعد المحاولة');
      Object.assign(rec, upd, { outAt: null });
      renderAttScreen();
      msg(`تم تسجيل انصرافك الساعة ${hm}`, true);
    }
  } catch (e) {
    const b = $('#punchBtn');
    if (b) { unbusy(b); b.textContent = label; }
    msg(e.user ? e.message : errMsg(e));
  }
}

/* ==================== الأحداث (تفويض مركزي) ==================== */
const ACTIONS = {
  tab: id => switchTab(id),
  logout: () => doLogout(),
  forgot: () => forgotPw(),
  authMode: id => setAuthMode(id),
  toEmp: () => { const s = readSess(); if (s) { showScreen('bootScreen'); restoreAtt(s).then(ok => { if (!ok) showAttLogin(); }); } else showAttLogin(); },
  toAdmin: () => showAuth(),
  attLogout: () => attLogout(),
  punch: id => attPunch(id),
  dayShift: id => { const t = today(); const d = addDays(CUR.recDate || t, +id); CUR.recDate = d >= t ? '' : d; renderView(); },
  recToday: () => { CUR.recDate = ''; renderView(); },
  monShift: id => { const cur = today().slice(0, 7); const m = addMonths(CUR.month || cur, +id); CUR.month = m >= cur ? '' : m; renderView(); },
  monCur: () => { CUR.month = ''; renderView(); },
  manual: id => recModal(null, id),
  editRec: id => recModal(id),
  delRec: id => delRec(id),
  print: () => printMonthly(),
  excel: (_, el) => exportMonthly(el),
  addEmp: () => empModal(null),
  editEmp: id => empModal(id),
  delEmp: id => delEmp(id),
  unbind: id => unbindDev(id),
  genCreds: () => genCreds(),
  copyCreds: () => copyCreds(),
  toggleDay: (id, el) => toggleDay(id, el),
  captureLoc: (id, el) => captureLoc(id, el),
  saveSettings: (id, el) => saveSettings(id, el),
  closeM: () => closeM(),
  retryMonth: () => { if (unsubMonth) unsubMonth(); unsubMonth = null; if (watchedMonth) delete ST.months[watchedMonth]; watchedMonth = null; renderView(); },
  mAct: i => { const a = _mActions[+i]; if (a) a.fn(); }
};
const CHANGES = {
  recDate: el => { const t = today(); CUR.recDate = el.value && el.value < t ? el.value : ''; renderView(); },
  month: el => { const cur = today().slice(0, 7); CUR.month = el.value && el.value < cur ? el.value : ''; renderView(); }
};
const INPUTS = { q: el => { CUR.q = el.value; applySearch(); } };
const SUBMITS = {
  auth: () => doAuth(),
  attLogin: () => attLoginSubmit(),
  modal: () => { const a = _mActions.find(x => x.primary); if (a) a.fn(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.id, el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el); });
document.addEventListener('submit', e => { const f = e.target; if (f.dataset && f.dataset.submit) { e.preventDefault(); if (SUBMITS[f.dataset.submit]) SUBMITS[f.dataset.submit](f); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeM(); });
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeM(); });
$('#view').addEventListener('focusout', () => {
  if (!_pendingRender) return;
  setTimeout(() => {
    const a = document.activeElement;
    if (a && $('#view').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
    _pendingRender = false;
    renderView();
  }, 0);
});
$('#fEmail').addEventListener('input', () => { $('#authErr').hidden = true; });
document.addEventListener('visibilitychange', () => {
  // عند العودة للتطبيق بعد مدة: تحديث شاشة الموظف (قد يكون يوماً جديداً)
  if (!document.hidden && ATT.user && !$('#attScreen').hidden && $('#punchBtn') && !$('#punchBtn').disabled) renderAttScreen();
});

/* ==================== الإقلاع ==================== */
function boot() {
  const cfgP = loadCfg();
  let first = true;
  auth.onAuthStateChanged(async user => {
    await cfgP;
    if (PENDING_SIGNUP) return;
    if (user) {
      try { await enterAdmin(user); } catch (e) { toast(errMsg(e), true); }
      first = false;
      return;
    }
    stopAdmin();
    if (first) {
      first = false;
      const s = readSess();
      if (s) { if (!(await restoreAtt(s))) showAttLogin(); return; }
    }
    showAuth();
  });
}
boot();
</script>
