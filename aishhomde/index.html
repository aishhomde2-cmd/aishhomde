<style>

.af{margin-bottom:14px}

.af input{width:100%;padding:12px 14px;border:1.5px solid #E8ECF6;border-radius:12px;font-size:15px;background:#F8F9FE;transition:.15s}

.topbar{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E8ECF6;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;font-weight:800}

.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(27,37,75,.08);margin-bottom:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{border-radius:16px;padding:18px;color:#fff;position:relative;overflow:hidden}
.kpi.g1{background:linear-gradient(135deg,#667EEA,#764BA2)}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
th{text-align:right;font-size:12px;font-weight:800;color:#8A96B5;padding:12px 14px;background:#FAFBFE;border-bottom:1px solid #E8ECF6}
td{padding:12px 14px;border-bottom:1px solid #E8ECF6;font-size:13.5px}
tbody tr:hover{background:#F8FAFF}
tbody tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:4px 11px;border-radius:30px;font-size:11.5px;font-weight:800}
.tg{background:#E5F8EF;color:#1A6B42}.tr{background:#FEEAEA;color:#FA5252}.ta{background:#FEF3E0;color:#9A6700}.tc{background:#F1F3FA;color:#8A96B5}.tb{background:#EAEFFF;color:#1E4DB7}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:11px;font-weight:700;font-size:13.5px;transition:.15s}
.btn-p{background:linear-gradient(135deg,#0C1A4B,#3B6FF5);color:#fff}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:#F2F4FA;color:#1B254B}

.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.empty{text-align:center;padding:50px 20px;color:#8A96B5}
.empty b{display:block;font-size:15px;color:#1B254B;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(11,20,55,.55);backdrop-filter:blur(5px);display:none;place-items:center;z-index:100;padding:16px}
.ov.open{display:grid}
.modal{background:#fff;border-radius:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.mh{padding:20px 22px;border-bottom:1px solid #E8ECF6;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}
.mh h3{font-size:17px;font-weight:800}
.mb{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid #E8ECF6;display:flex;gap:9px}
.mf .btn{flex:1;justify-content:center}
.cx{width:32px;height:32px;border-radius:8px;background:#F2F4FA;color:#8A96B5;display:grid;place-items:center}
.f{margin-bottom:14px}
.f label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:11px 13px;border:1.5px solid #E8ECF6;border-radius:11px;background:#FAFBFE;font-size:14px}
.f input:focus,.f select:focus{outline:none;border-color:#3A55D9;background:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(130px);background:#0C1A4B;color:#fff;padding:13px 22px;border-radius:13px;font-weight:700;font-size:13.5px;z-index:200;transition:.3s;box-shadow:0 16px 40px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}

.att-screen{min-height:100vh;background:linear-gradient(135deg,#0C1A4B,#1E3A8A);display:none;align-items:flex-start;justify-content:center;padding:20px}
.att-box{width:100%;max-width:440px}
.att-head{text-align:center;color:#fff;margin:10px 0 20px}
.att-head .t{font-size:20px;font-weight:800}
.att-head .s{opacity:.85;font-size:13px;margin-top:3px}
.att-card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin-bottom:16px}
.att-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.att-info .nm{font-weight:800;font-size:17px}
.att-info .jb{color:#8A96B5;font-size:12.5px}
.clock{background:#F2F4FA;border-radius:14px;padding:16px;text-align:center;margin-bottom:18px}
.clock .t{font-size:34px;font-weight:800;letter-spacing:1px}
.clock .d{color:#8A96B5;font-size:13px;margin-top:2px}
.clock .s{margin-top:10px;font-weight:700;font-size:13.5px}
.msg{padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:14px;display:none;line-height:1.7;white-space:pre-line}
.msg.ok{background:#E5F8EF;color:#1A6B42}
.msg.err{background:#FEEAEA;color:#C92A2A}
.att-btn{width:100%;padding:16px;border-radius:13px;font-size:16px;font-weight:800;color:#fff}
.att-btn.in{background:linear-gradient(135deg,#0C1A4B,#3B6FF5)}
.att-btn.out{background:#FA5252}
.gps-status{text-align:center;font-size:10.5px;margin-top:10px;font-weight:700}
.gps-status.on{color:#1FBF75}.gps-status.off{color:#FA5252}
@media(max-width:700px){.content{padding:14px}.topbar h1{font-size:16px}.kpi .v{font-size:22px}}
</style>

<body>

<!-- شاشة الدخول -->
<div id="authScreen">
  <div class="auth-wrap"><div class="auth-box">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <h1 id="authTitle">نظام الحضور والانصراف</h1>
    <div class="sub" id="authSub">تسجيل الدخول</div>
    <div class="aerr" id="authErr"></div>

    <div class="af" id="wName" style="display:none"><label>الاسم الكامل</label><input type="text" id="fName"></div>
    <div class="af" id="wEmail"><label>البريد الإلكتروني</label><input type="email" id="fEmail" dir="ltr" autocomplete="username"></div>
    <div class="af" id="wPass"><label>كلمة المرور</label><input type="password" id="fPass" dir="ltr" autocomplete="current-password"></div>
    <div class="af" id="wPass2" style="display:none"><label>تأكيد كلمة المرور</label><input type="password" id="fPass2" dir="ltr"></div>

    <button class="abtn" id="authBtn" onclick="doAuth()">دخول</button>
    <div class="afoot" id="authFoot"></div>
  </div></div>
</div>

<!-- شاشة الموظف -->
<div class="att-screen" id="attScreen">
  <div class="att-box">
    <div class="att-head"><div class="t" id="attSchool">مدرستي</div><div class="s">تسجيل الحضور والانصراف</div></div>
    <div class="att-card">
      <div class="att-info"><div><div class="nm" id="attName"></div><div class="jb" id="attJob"></div></div><button class="btn btn-g btn-sm" onclick="attLogout()">خروج</button></div>
      <div class="clock"><div class="t" id="attClock">--:--</div><div class="d" id="attDate"></div><div class="s" id="attStatus"></div></div>
      <div id="attMsg" class="msg"></div>
      <div id="attActions"></div>
      <div class="gps-status" id="attGps"></div>
    </div>
    <div class="att-card"><h3 style="font-size:14px;margin-bottom:12px">سجلّي (آخر ١٤ يوماً)</h3><div id="attHistory"></div></div>
  </div>
</div>

<!-- التطبيق (للمدير) -->
<div class="app" id="app">
  <div class="topbar"><h1 id="appTitle">مدرستي</h1><div class="user"><span id="userInfo"></span><button class="btn btn-r btn-sm" onclick="doLogout()">خروج</button></div></div>
  <div class="content">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";

/* ========================================================
   ⚙️ إعدادات Firebase — مشروع school-attendance-3a2e8
   ======================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZ3FGtw_oK-EF9tjdykhirDqWZbcUGGaBs",
  authDomain: "school-attendance-3a2e8.firebaseapp.com",
  projectId: "school-attendance-3a2e8",
  storageBucket: "school-attendance-3a2e8.firebasestorage.app",
  messagingSenderId: "908181466748",
  appId: "1:908181466748:web:9b04c39786a8100b48e3f9"
};

// تهيئة Firebase (مرة واحدة)
if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

/* ====== أدوات ====== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const n = v => { const x = Number(v); return isNaN(x) ? 0 : x; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const AR_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const fmtDate = d => { if (!d) return '—'; const p = d.split('-'); return p.length < 3 ? d : `${p[2]}/${p[1]}/${p[0]}`; };

function hashPw(s) { let h = 5381; for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h = h & 0xffffffff; } return String(h >>> 0); }

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (err ? ' err' : '');
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ====== حالة ====== */
let CUR = { user: null, role: 'viewer', tab: 'records' };
let ATT_USER = null;
let ST = { cfg: null, attUsers: [], attendance: [], permits: [], users: [] };

/* ====== إعدادات افتراضية ====== */
const DEFAULT_CFG = {
  name: 'مدرستي',
  year: '١٤٤٧هـ',
  att: {
    inTime: '07:00',
    outTime: '13:00',
    graceMin: 5,
    lat: null,
    lng: null,
    radius: 150,
    workDays: [0, 1, 2, 3, 4]
  }
};

/* ==================== الدخول ==================== */
let AUTH_MODE = 'login';

function setAuthMode(m) {
  AUTH_MODE = m;
  const err = $('#authErr'); err.style.display = 'none';
  if (m === 'signup') {
    $('#authSub').textContent = 'إنشاء حساب المالك (أول استخدام فقط)';
    $('#wName').style.display = '';
    $('#wEmail').style.display = '';
    $('#wPass').style.display = '';
    $('#wPass2').style.display = '';
    $('#authBtn').textContent = 'إنشاء الحساب والدخول';
    $('#authFoot').innerHTML = 'لديك حساب؟ <a onclick="setAuthMode(\'login\')">سجّل الدخول</a>';
  } else {
    $('#authSub').textContent = 'تسجيل الدخول لنظام الإدارة';
    $('#wName').style.display = 'none';
    $('#wEmail').style.display = '';
    $('#wPass').style.display = '';
    $('#wPass2').style.display = 'none';
    $('#authBtn').textContent = 'دخول';
    $('#authFoot').innerHTML = '';
  }
}

function showErr(m) { const e = $('#authErr'); e.textContent = m; e.style.display = 'block'; }

async function doAuth() {
  const err = $('#authErr'); err.style.display = 'none';
  const email = ($('#fEmail').value || '').trim().toLowerCase();
  const pass = $('#fPass').value || '';
  const btn = $('#authBtn'); btn.disabled = true;

  try {
    if (AUTH_MODE === 'signup') {
      const nm = ($('#fName').value || '').trim();
      const p2 = $('#fPass2').value || '';
      if (!nm) throw new Error('أدخل اسمك الكامل');
      if (!email) throw new Error('أدخل البريد الإلكتروني');
      if (pass.length < 6) throw new Error('كلمة المرور ٦ أحرف على الأقل');
      if (pass !== p2) throw new Error('كلمتا المرور غير متطابقتين');

      btn.textContent = 'جاري...';
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      // حفظ بيانات المالك
      await db.collection('users').doc(cred.user.uid).set({
        name: nm, email, role: 'owner', createdAt: new Date().toISOString()
      });
      // حفظ الإعدادات الافتراضية إن لم تكن موجودة
      const cfgDoc = await db.collection('meta').doc('config').get();
      if (!cfgDoc.exists) {
        DEFAULT_CFG.name = 'مدرسة ' + nm;
        await db.collection('meta').doc('config').set(DEFAULT_CFG);
      }
      toast('تم إنشاء الحساب ✓');
      await afterLogin(cred.user, nm);
    } else {
      if (!email || !pass) throw new Error('أدخل البريد وكلمة المرور');
      btn.textContent = 'جاري...';
      const cred = await auth.signInWithEmailAndPassword(email, pass);
      toast('تم تسجيل الدخول ✓');
      await afterLogin(cred.user);
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = AUTH_MODE === 'signup' ? 'إنشاء الحساب والدخول' : 'دخول';
    const code = e.code || '';
    let msg = e.message;
    if (code === 'auth/email-already-in-use') msg = 'هذا البريد مسجّل مسبقاً';
    if (code === 'auth/weak-password') msg = 'كلمة المرور ضعيفة';
    if (code === 'auth/wrong-password' || code === 'auth/user-not-found' || code === 'auth/invalid-credential') msg = 'البريد أو كلمة المرور غير صحيحة';
    if (code === 'auth/api-key-not-valid') msg = 'مفتاح API غير صالح — راجع الإعدادات';
    if (code === 'auth/invalid-api-key') msg = 'مفتاح API غير صالح';
    if (code === 'permission-denied' || (msg || '').includes('permission')) msg = 'لا توجد صلاحيات — راجع قواعد Firestore';
    showErr(msg || 'حدث خطأ');
  }
}

async function afterLogin(fbUser, signupName) {
  CUR.user = { uid: fbUser.uid, email: fbUser.email, name: signupName || fbUser.displayName || fbUser.email };

  // جلب دور المستخدم
  try {
    const doc = await db.collection('users').doc(fbUser.uid).get();
    if (doc.exists) {
      const d = doc.data();
      CUR.role = d.role || 'owner';
      if (d.name) CUR.user.name = d.name;
    } else {
      // مستخدم موجود في Auth لكن ليس في Firestore → نعتبره مالكاً
      CUR.role = 'owner';
      try {
        await db.collection('users').doc(fbUser.uid).set({
          name: CUR.user.name, email: fbUser.email, role: 'owner', createdAt: new Date().toISOString()
        });
      } catch (e) { }
    }
  } catch (e) {
    CUR.role = 'owner';
  }

  // جلب الإعدادات
  try {
    const cfgDoc = await db.collection('meta').doc('config').get();
    if (cfgDoc.exists) {
      ST.cfg = cfgDoc.data();
      ST.cfg.att = Object.assign({}, DEFAULT_CFG.att, ST.cfg.att || {});
    } else {
      ST.cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
    }
  } catch (e) {
    ST.cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
  }

  // جلب قوائم البيانات (best effort — التبويب الفعال فقط يحتاجها)
  await loadData();
  showApp();
}

async function loadData() {
  const cols = ['attUsers', 'attendance', 'permits', 'users'];
  for (const c of cols) {
    try {
      const snap = await db.collection(c).get();
      ST[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      ST[c] = [];
    }
  }
}

function doLogout() {
  auth.signOut().catch(() => { });
  CUR.user = null;
  $('#app').style.display = 'none';
  $('#authScreen').style.display = '';
  setAuthMode('login');
  $('#fPass').value = '';
  if ($('#fPass2')) $('#fPass2').value = '';
  toast('تم تسجيل الخروج');
}

function showApp() {
  $('#authScreen').style.display = 'none';
  $('#attScreen').style.display = 'none';
  $('#app').style.display = 'block';
  $('#appTitle').textContent = ST.cfg.name || 'مدرستي';
  document.title = (ST.cfg.name || 'مدرستي') + ' — الحضور';
  $('#userInfo').innerHTML = `<b>${esc(CUR.user.name)}</b>`;
  renderTabs();
  renderView();
}

/* ==================== التبويبات ==================== */
const TABS = [
  ['records', 'السجلات'],
  ['stats', 'الإحصائيات'],
  ['monthly', 'التقرير الشهري'],
  ['accounts', 'حسابات الموظفين'],
  ['settings', 'الإعدادات']
];

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, l]) =>
    `<button class="${CUR.tab === k ? 'on' : ''}" onclick="switchTab('${k}')">${l}</button>`
  ).join('');
}

function switchTab(t) { CUR.tab = t; renderTabs(); renderView(); }

function renderView() {
  const map = { records: vRecords, stats: vStats, monthly: vMonthly, accounts: vAccounts, settings: vSettings };
  const fn = map[CUR.tab] || vRecords;
  $('#view').innerHTML = fn();
}

/* ==================== أدوات الحضور ==================== */
function attParseHM(t) { if (!t) return 0; const [h, m] = String(t).split(':').map(Number); return (h || 0) * 60 + (m || 0); }
function attNowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function attLateMin(inHM) { const s = attParseHM(ST.cfg?.att?.inTime || '07:00'); const g = n(ST.cfg?.att?.graceMin || 0); return Math.max(0, attParseHM(inHM) - s - g); }
function attEarlyMin(outHM) { if (!outHM) return 0; const s = attParseHM(ST.cfg?.att?.outTime || '13:00'); return Math.max(0, s - attParseHM(outHM)); }
function attWorkMin(inHM, outHM) { if (!inHM || !outHM) return 0; return Math.max(0, attParseHM(outHM) - attParseHM(inHM)); }
function isWorkDay(d) { const wd = ST.cfg?.att?.workDays || [0, 1, 2, 3, 4]; return wd.includes(new Date(d + 'T00:00:00').getDay()); }

function attDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLng = toR(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('جهازك لا يدعم تحديد الموقع'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e => {
        let m = 'تعذّر تحديد الموقع';
        if (e.code === 1) m = 'يجب السماح بالوصول للموقع';
        if (e.code === 3) m = 'انتهت مهلة تحديد الموقع';
        rej(new Error(m));
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

function getBestPos(tries) {
  return new Promise(async (res, rej) => {
    let best = null; const N = tries || 3;
    for (let i = 0; i < N; i++) {
      try { const p = await getPos(); if (!best || p.acc < best.acc) best = p; if (p.acc <= 20) break; }
      catch (e) { if (i === N - 1 && !best) return rej(e); }
      if (i < N - 1) await new Promise(r => setTimeout(r, 800));
    }
    if (!best) return rej(new Error('تعذّر تحديد الموقع'));
    res(best);
  });
}

async function saveManualAtt() {

/* ==================== تبويب: الإحصائيات ==================== */
function vStats() {
  const curMonth = window._statMonth || today().slice(0, 7);
  const [y, m] = curMonth.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthDays = [];
  for (let d = 1; d <= daysInMonth; d++) monthDays.push(curMonth + '-' + String(d).padStart(2, '0'));
  const workPast = monthDays.filter(d => isWorkDay(d) && d < today());
  const inMonth = r => r.date >= monthDays[0] && r.date <= monthDays[monthDays.length - 1];

  const stats = ST.attUsers.filter(u => u.active !== false).map(u => {
    const recs = ST.attendance.filter(r => r.userId === u.id && inMonth(r));
    const present = recs.length;
    const attendedDates = new Set(recs.map(r => r.date));
    const joinDate = u.joinDate || (recs.length ? recs.map(r => r.date).sort()[0] : null);
    const eligible = joinDate ? workPast.filter(d => d >= joinDate) : [];
    const permitDays = 0; // بدون أذونات في هذا الإصدار
    const absent = eligible.filter(d => !attendedDates.has(d)).length;
    const lateDays = recs.filter(r => r.lateMin > 0).length;
    const totalLate = recs.reduce((a, r) => a + n(r.lateMin), 0);
    const earlyDays = recs.filter(r => attEarlyMin(r.outTime) > 0).length;
    const pct = eligible.length ? Math.min(100, Math.round(present / eligible.length * 100)) : 0;
    return { u, present, absent, lateDays, totalLate, earlyDays, pct, eligibleCount: eligible.length };
  }).sort((a, b) => b.pct - a.pct || b.present - a.present);

  const rows = stats.map((s, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    const color = s.pct >= 90 ? '#1FBF75' : s.pct >= 70 ? '#F59F00' : '#FA5252';
    return `<tr>
      <td style="text-align:center;font-weight:800">${medal}</td>
      <td style="font-weight:700">${esc(s.u.name)}</td>
      <td>${esc(s.u.job || '—')}</td>
      <td style="color:#1FBF75;font-weight:700">${s.present}</td>
      <td style="color:${s.absent ? '#FA5252' : '#8A96B5'};font-weight:700">${s.absent}</td>
      <td style="color:#F59F00">${s.lateDays > 0 ? s.lateDays + ' (' + s.totalLate + 'د)' : '—'}</td>
      <td style="color:#FA5252">${s.earlyDays || '—'}</td>
      <td style="color:${color};font-weight:800">${s.pct}%</td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" class="empty"><b>لا بيانات</b></td></tr>';

  return `
    <div class="card">
      <div class="tbar">
        <label style="font-weight:700;font-size:13px">الشهر:</label>
        <input type="month" value="${curMonth}" onchange="window._statMonth=this.value;renderView()" style="padding:8px 12px;border:1.5px solid #E8ECF6;border-radius:10px">
        <button class="btn btn-g btn-sm" onclick="window._statMonth='';renderView()">الشهر الحالي</button>
      </div>
      <table><thead><tr><th>#</th><th>الموظف</th><th>الوظيفة</th><th>حضور</th><th>غياب</th><th>تأخّر</th><th>انصراف مبكّر</th><th>نسبة الالتزام</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}

function printMonthly() {
  const curMonth = window._monMonth || today().slice(0, 7);
  const [y, m] = curMonth.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthDays = [];
  for (let d = 1; d <= daysInMonth; d++) monthDays.push(curMonth + '-' + String(d).padStart(2, '0'));
  const inMonth = r => r.date >= monthDays[0] && r.date <= monthDays[monthDays.length - 1];

  let rows = '';
  ST.attUsers.filter(u => u.active !== false).forEach(u => {
    const recs = ST.attendance.filter(r => r.userId === u.id && inMonth(r));
    const present = recs.length;
    const lateDays = recs.filter(r => r.lateMin > 0).length;
    const totalLate = recs.reduce((a, r) => a + n(r.lateMin), 0);
    const earlyDays = recs.filter(r => attEarlyMin(r.outTime) > 0).length;
    rows += `<tr><td>${esc(u.name)}</td><td>${esc(u.job || '—')}</td><td>${present}</td><td>${lateDays > 0 ? lateDays + ' (' + totalLate + 'د)' : '—'}</td><td>${earlyDays || '—'}</td></tr>`;
  });

  const html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>التقرير الشهري</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Cairo';padding:30px;color:#1B254B}h1{color:#1E2A6B}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#1E2A6B;color:#fff;padding:10px;text-align:right}td{padding:9px;border-bottom:1px solid #E8ECF6}@media print{.np{display:none}}</style></head><body>
  <button class="np" onclick="window.print()" style="padding:10px 22px;background:#3A55D9;color:#fff;border:none;border-radius:10px;font-family:Cairo;font-weight:700;cursor:pointer">🖨 طباعة</button>
  <h1>${esc(ST.cfg.name)}</h1><div style="color:#8A96B5">التقرير الشهري — ${AR_MONTHS[m - 1]} ${y}</div>
  <table><thead><tr><th>الموظف</th><th>الوظيفة</th><th>حضور</th><th>تأخّر</th><th>انصراف مبكّر</th></tr></thead><tbody>${rows}</tbody></table>
  </body></html>`;
  const w = window.open('', '_blank');
  if (!w) return toast('اسمح بالنوافذ المنبثقة', true);
  w.document.write(html); w.document.close();
}

function exportMonthly() {
  if (!window.XLSX) return toast('Excel غير متاح', true);
  const curMonth = window._monMonth || today().slice(0, 7);
  const [y, m] = curMonth.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthDays = [];
  for (let d = 1; d <= daysInMonth; d++) monthDays.push(curMonth + '-' + String(d).padStart(2, '0'));
  const inMonth = r => r.date >= monthDays[0] && r.date <= monthDays[monthDays.length - 1];
  const rows = ST.attUsers.filter(u => u.active !== false).map(u => {
    const recs = ST.attendance.filter(r => r.userId === u.id && inMonth(r));
    const present = recs.length;
    const lateDays = recs.filter(r => r.lateMin > 0).length;
    const totalLate = recs.reduce((a, r) => a + n(r.lateMin), 0);
    const earlyDays = recs.filter(r => attEarlyMin(r.outTime) > 0).length;
    return { 'الموظف': u.name, 'الوظيفة': u.job || '', 'أيام الحضور': present, 'أيام التأخر': lateDays, 'دقائق التأخر': totalLate, 'أيام الانصراف المبكر': earlyDays };
  });
  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'الموظف': 'لا بيانات' }]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'التقرير');
  XLSX.writeFile(wb, `تقرير-${curMonth}.xlsx`);
  toast('تم التصدير');
}

  const name = ($('#uName').value || '').trim();
  const job = $('#uJob').value;
  const username = ($('#uUser').value || '').trim().toLowerCase();
  const pass = ($('#uPass').value || '').trim();
  if (!name) return toast('أدخل الاسم', true);
  if (!username) return toast('أدخل اسم المستخدم', true);
  if (!/^[a-z0-9_.]+$/.test(username)) return toast('اسم المستخدم بأحرف إنجليزية وأرقام فقط', true);
  if (!id && (!pass || pass.length < 4)) return toast('كلمة المرور ٤ أحرف على الأقل', true);

  const dup = ST.attUsers.find(x => (x.username || '').toLowerCase() === username && x.id !== id);
  if (dup) return toast('اسم المستخدم مستخدم مسبقاً', true);

  const u = id ? ST.attUsers.find(x => x.id === id) : null;
  const obj = Object.assign({}, u || {}, {
    name, job, username,
    active: u ? ($('#uActive').value === '1') : true,
    pwHash: pass ? hashPw(pass) : (u?.pwHash || ''),
    pwPlain: pass || (u?.pwPlain || ''),
    joinDate: u?.joinDate || today()
  });

  try {
    if (id) {
      await db.collection('attUsers').doc(id).set(obj, { merge: true });
      ST.attUsers = ST.attUsers.map(x => x.id === id ? { id, ...obj } : x);
    } else {
      const ref = await db.collection('attUsers').add(obj);
      ST.attUsers.push({ id: ref.id, ...obj });
    }
    closeM(); renderView(); toast(id ? 'تم الحفظ' : 'تمت الإضافة');
  } catch (e) { toast('تعذّر: ' + e.message, true); }
}

function editAttUser(id) { addAttUser(id); }

function delAttUser(id) {
  const u = ST.attUsers.find(x => x.id === id);
  if (!confirm('حذف حساب ' + (u?.name || '') + '؟')) return;
  db.collection('attUsers').doc(id).delete().then(() => {
    ST.attUsers = ST.attUsers.filter(x => x.id !== id);
    renderView(); toast('تم الحذف');
  }).catch(e => toast('تعذّر: ' + e.message, true));
}

function unbindDev(id) {
  if (!confirm('فكّ ارتباط الجهاز؟ سيسمح بالدخول من جهاز آخر.')) return;
  db.collection('attUsers').doc(id).update({ deviceId: null, deviceFp: null, deviceBoundAt: null })
    .then(() => {
      const u = ST.attUsers.find(x => x.id === id);
      if (u) { u.deviceId = null; u.deviceFp = null; u.deviceBoundAt = null; }
      renderView(); toast('تم فكّ الارتباط');
    }).catch(e => toast('تعذّر: ' + e.message, true));
}

async function saveAttSettings() {
  const latV = ($('#sLat').value || '').trim();
  const lngV = ($('#sLng').value || '').trim();
  const att = {
    inTime: $('#sIn').value || '07:00',
    outTime: $('#sOut').value || '13:00',
    graceMin: n($('#sGrace').value),
    radius: Math.max(20, n($('#sRad').value) || 150),
    workDays: window._editDays ? [...window._editDays].sort((a, b) => a - b) : (ST.cfg.att?.workDays || [0, 1, 2, 3, 4])
  };
  if (latV !== '' && lngV !== '') {
    const la = parseFloat(latV), ln = parseFloat(lngV);
    if (isNaN(la) || isNaN(ln)) return toast('إحداثيات غير صحيحة', true);
    att.lat = la; att.lng = ln;
  } else {
    att.lat = ST.cfg.att?.lat ?? null;
    att.lng = ST.cfg.att?.lng ?? null;
  }
  if (!att.workDays.length) return toast('حدّد يوم دوام واحداً على الأقل', true);
  window._editDays = null;

  try {
    await db.collection('meta').doc('config').set({ att }, { merge: true });
    ST.cfg.att = att;
    renderView();
    toast('تم حفظ الإعدادات ✓');
  } catch (e) { toast('تعذّر: ' + e.message, true); }
}

async function attLoginSubmit() {
  const u = ($('#attU').value || '').trim().toLowerCase();
  const p = $('#attP').value || '';
  const err = $('#attErr'); err.style.display = 'none';
  if (!u || !p) { err.textContent = 'أدخل البيانات'; err.style.display = 'block'; return; }

  const btn = $('#attBtn'); btn.disabled = true; btn.textContent = 'جاري...';

  try {
    // جلب إعدادات المدرسة أولاً (للـ GPS)
    if (!ST.cfg?.att) {
      const cfgDoc = await db.collection('meta').doc('config').get();
      ST.cfg = cfgDoc.exists ? cfgDoc.data() : JSON.parse(JSON.stringify(DEFAULT_CFG));
      ST.cfg.att = Object.assign({}, DEFAULT_CFG.att, ST.cfg.att || {});
    }

    // تحقّق من وجود مستخدمي الحضور
    let users = ST.attUsers;
    if (!users.length) {
      const snap = await db.collection('attUsers').get();
      users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      ST.attUsers = users;
    }

    const emp = users.find(x => (x.username || '').toLowerCase() === u && x.pwHash === hashPw(p));
    if (!emp) { btn.disabled = false; btn.textContent = 'دخول'; err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة'; err.style.display = 'block'; return; }
    if (emp.active === false) { btn.disabled = false; btn.textContent = 'دخول'; err.textContent = 'الحساب موقوف'; err.style.display = 'block'; return; }

    // ربط الجهاز
    const devId = localStorage.getItem('kg:deviceId') || (() => {
      const raw = [navigator.userAgent, screen.width + 'x' + screen.height, new Date().getTimezoneOffset()].join('|');
      let h = 5381; for (let i = 0; i < raw.length; i++) { h = ((h << 5) + h) + raw.charCodeAt(i); h = h & 0xffffffff; }
      const id = 'fp-' + (h >>> 0).toString(36);
      localStorage.setItem('kg:deviceId', id);
      return id;
    })();

    if (emp.deviceId && emp.deviceId !== devId) {
      btn.disabled = false; btn.textContent = 'دخول';
      err.innerHTML = '⛔ الحساب مرتبط بجهاز آخر.<br>اطلب من المالك فكّ الارتباط.';
      err.style.display = 'block'; return;
    }
    if (!emp.deviceId) {
      emp.deviceId = devId; emp.deviceBoundAt = new Date().toISOString();
      await db.collection('attUsers').doc(emp.id).update({ deviceId: devId, deviceBoundAt: emp.deviceBoundAt });
    }

    ATT_USER = emp;
    // جلب سجلات الموظف
    const snap = await db.collection('attendance').where('userId', '==', emp.id).get();
    ST.attendance = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    showAttScreen();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'دخول';
    err.textContent = e.message || 'خطأ';
    err.style.display = 'block';
  }
}

        <div class="clock"><div class="t" id="attClock">${attNowHM()}</div><div class="d">${new Date().toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div><div class="s" style="color:${statusColor}">${status}</div></div>
        ${rec ? `<div style="background:#F2F4FA;border-radius:12px;padding:14px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:#8A96B5;font-size:12.5px">حضور</span><b style="color:#1FBF75">${rec.inTime || '—'}</b></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:#8A96B5;font-size:12.5px">انصراف</span><b style="color:${rec.outTime ? '#FA5252' : '#8A96B5'}">${rec.outTime || '—'}</b></div>
          ${rec.lateMin > 0 ? `<div style="display:flex;justify-content:space-between"><span style="color:#8A96B5;font-size:12.5px">تأخّر</span><b style="color:#F59F00">${rec.lateMin} دقيقة</b></div>` : ''}
        </div>` : ''}
        <div id="attMsg" class="msg"></div>
        ${!rec ? `<button class="att-btn in" onclick="attCheckIn()" id="attBtn2">تسجيل الحضور الآن</button>` :
      !rec.outTime ? `<button class="att-btn out" onclick="attCheckOut()" id="attBtn2">تسجيل الانصراف الآن</button>` :
        `<div style="text-align:center;color:#1FBF75;font-weight:700;padding:12px">✓ تم تسجيل حضورك وانصرافك</div>`}
        <div class="gps-status ${gpsReady ? 'on' : 'off'}">${gpsReady ? '✓ نظام الموقع جاهز — النطاق: ' + n(ST.cfg.att.radius) + 'م' : '✗ موقع المدرسة غير محدّد'}</div>
      </div>
      <div class="att-card"><h3 style="font-size:14px;margin-bottom:12px">سجلّي (آخر ١٤ يوماً)</h3>
        <table style="font-size:12.5px"><thead><tr><th>التاريخ</th><th>حضور</th><th>انصراف</th><th>تأخّر</th></tr></thead><tbody>${hist}</tbody></table>
      </div>

  window._attClk = setInterval(() => { const c = $('#attClock'); if (c) c.textContent = attNowHM(); else clearInterval(window._attClk); }, 10000);

function attMsg(txt, ok) {
  const m = $('#attMsg');
  if (!m) return;
  m.textContent = txt;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.style.display = 'block';
}

async function verifyLocation() {
  const c = ST.cfg.att;
  if (!c || c.lat == null || c.lng == null) return { ok: false, reason: 'موقع المدرسة غير محدّد — تواصل مع الإدارة' };
  const pos = await getBestPos(3);
  const dist = Math.round(attDistance(pos.lat, pos.lng, Number(c.lat), Number(c.lng)));
  const acc = Math.round(pos.acc || 0);
  const radius = n(c.radius || 150);
  const margin = Math.min(acc, 30);
  if (dist > radius + margin) return { ok: false, dist, radius, acc };
  return { ok: true, dist, acc };
}

async function attCheckIn() {
  const btn = $('#attBtn2');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري تحديد الموقع...'; }
  try {
    if (ST.attendance.find(r => r.userId === ATT_USER.id && r.date === today())) {
      attMsg('سجّلت حضورك مسبقاً', false); renderAttScreen(); return;
    }
    const loc = await verifyLocation();
    if (!loc.ok) {
      if (loc.reason) attMsg('⛔ ' + loc.reason, false);
      else attMsg(`⛔ أنت خارج النطاق.\nالمسافة: ${loc.dist}م · النطاق: ${loc.radius}م · دقّتك: ±${loc.acc}م`, false);
      if (btn) { btn.disabled = false; btn.textContent = 'تسجيل الحضور الآن'; }
      return;
    }
    const inTime = attNowHM();
    const rec = {
      userId: ATT_USER.id, userName: ATT_USER.name, date: today(),
      inTime, lateMin: attLateMin(inTime), outTime: '', ts: Date.now()
    };
    const ref = await db.collection('attendance').add(rec);
    ST.attendance.push({ id: ref.id, ...rec });
    renderAttScreen();
    setTimeout(() => attMsg('✓ تم تسجيل حضورك', true), 50);
  } catch (e) {
    attMsg(e.message || 'خطأ', false);
    if (btn) { btn.disabled = false; btn.textContent = 'تسجيل الحضور الآن'; }
  }
}

async function attCheckOut() {
  const btn = $('#attBtn2');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري تحديد الموقع...'; }
  try {
    const rec = ST.attendance.find(r => r.userId === ATT_USER.id && r.date === today());
    if (!rec) { attMsg('سجّل حضورك أولاً', false); renderAttScreen(); return; }
    if (rec.outTime) { attMsg('سجّلت انصرافك مسبقاً', false); renderAttScreen(); return; }
    const loc = await verifyLocation();
    if (!loc.ok) {
      if (loc.reason) attMsg('⛔ ' + loc.reason, false);
      else attMsg(`⛔ أنت خارج النطاق.\nالمسافة: ${loc.dist}م · النطاق: ${loc.radius}م`, false);
      if (btn) { btn.disabled = false; btn.textContent = 'تسجيل الانصراف الآن'; }
      return;
    }
    const outTime = attNowHM();
    await db.collection('attendance').doc(rec.id).update({
      outTime, earlyMin: attEarlyMin(outTime), workMin: attWorkMin(rec.inTime, outTime)
    });
    rec.outTime = outTime;
    renderAttScreen();
    setTimeout(() => attMsg('✓ تم تسجيل انصرافك', true), 50);
  } catch (e) {
    attMsg(e.message || 'خطأ', false);
    if (btn) { btn.disabled = false; btn.textContent = 'تسجيل الانصراف الآن'; }
  }
}

/* ==================== إقلاع ==================== */
async function boot() {
  // جلب الإعدادات الأولية لاسم المدرسة
  try {
    const cfgDoc = await db.collection('meta').doc('config').get();
    if (cfgDoc.exists) {
      ST.cfg = cfgDoc.data();
      ST.cfg.att = Object.assign({}, DEFAULT_CFG.att, ST.cfg.att || {});
    } else {
      ST.cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
    }
  } catch (e) {
    ST.cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
  }

  // التحقّق من وجود مستخدمين (لاختيار شاشة دخول أو إنشاء حساب)
  auth.onAuthStateChanged(async user => {
    if (user) {
      // مسجّل دخول بالفعل
      await afterLogin(user);
    } else {
      // شاشة الدخول
      $('#authScreen').style.display = '';
      $('#app').style.display = 'none';
      // اختر الوضع
      try {
        const usersSnap = await db.collection('users').limit(1).get();
        setAuthMode(usersSnap.empty ? 'signup' : 'login');
      } catch (e) {
        setAuthMode('signup');
      }
    }
  });

  // رابط دخول الموظفين (أسفل الشاشة)
  const empLink = document.createElement('div');
  empLink.style.cssText = 'text-align:center;margin-top:14px;padding-top:14px;border-top:1px solid #E8ECF6';
  empLink.innerHTML = '<a style="color:#3A55D9;font-weight:700;cursor:pointer;font-size:13px" onclick="showAttLogin()">دخول الموظفين — الحضور والانصراف</a>';
